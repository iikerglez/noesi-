<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">

<style>

.tg[aria-checked=true]{background:var(--btn)}
.tg[aria-checked=true]::after{left:23px;background:var(--btnink)}
.p{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;border-radius:28px;font-size:16px;font-weight:600}
.pv{width:100%;height:118px;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.nav{position:absolute;left:20px;right:20px;bottom:24px;height:68px;border-radius:34px;display:flex;align-items:center;padding:0 8px;gap:4px}
.n{flex:1;height:52px;border-radius:26px;display:grid;place-items:center}

.f{display:block;width:100%;height:50px;border-radius:25px;padding:0 18px;font:inherit;font-size:16px;color:var(--ink);outline:0;background:var(--gbg);border:1px solid var(--gbd)}
select.f{padding:0 10px}select.f option{color:#000;background:#fff}
label.d{display:flex;flex-direction:column;gap:6px;margin:0}

.sh{width:100%;border-radius:32px;padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--sheet);max-height:100%;overflow-y:auto}
#ts{position:absolute;left:20px;right:20px;bottom:104px;padding:14px 18px;border-radius:24px;background:var(--sheet);border:1px solid var(--gbd);box-shadow:0 10px 30px var(--gsh);font-size:15px;z-index:5}
.dy{border-radius:14px;background:var(--chip);height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600;gap:2px}
.dt{width:5px;height:5px;border-radius:3px;background:var(--btn)}
.rule{width:64px;height:6px;border-top:1px solid var(--ac);border-bottom:1px solid var(--ac);opacity:.7;margin:6px auto}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.wd{display:inline-block;opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
.fi{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.orb{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),var(--chip) 62%);border:1px solid var(--gbd);box-shadow:inset 0 2px 0 var(--gin),0 18px 50px var(--gsh);animation:up 1.2s both,fl 6s ease-in-out 1.2s infinite}

.sf{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.5px}
.sq{display:flex;align-items:flex-end;gap:8px;padding:12px;border-radius:26px}
</style>

<body>

const Q=[['¿Qué estudias?','Selecciona una opción'],['¿Por qué te cuesta estudiar?','Selecciona todas las opciones que correspondan'],['¿En qué horario estudias?','Puedes añadir varias franjas horarias, por ejemplo de 16:00 a 17:00 y de 19:00 a 20:00'],['¿Qué asignaturas cursas?','Selecciona las tuyas o añade otras'],['¿Tienes asignaturas pendientes de cursos anteriores?','Indica si debes recuperar alguna asignatura. Si es así, selecciónala y añade, si la conoces, la fecha de recuperación.']];

const pdUI=()=>{const yn=S.pendYes;let h=opts(['No, no tengo ninguna','Sí, tengo asignaturas pendientes'],yn<0?[]:[yn?1:0],'py');if(yn===1){const nm=[...new Set([...SUBJ,...S.subj,...S.pend.map(x=>x.s)])];h+=`<div class="s" style="margin:6px 0 0 6px">¿Cuáles necesitas recuperar?</div>`+nm.map(n=>{const on=S.pend.some(x=>x.s===n);return `<button class="g o ${on?'on':''}" data-a="op2:${encodeURIComponent(n)}" aria-pressed="${on}" style="min-height:52px">${esc(n)}<span class="c">${on?I('chk'):''}</span></button>`}).join('')+`<div style="display:flex;gap:10px"><input id="np" class="f" aria-label="Otra asignatura pendiente" placeholder="Otra asignatura" style="flex:1"><button class="pb" data-a="np2" style="height:50px">Añadir</button></div>`+S.pend.map((x,i)=>`<div class="g" style="padding:16px;border-radius:28px;display:flex;flex-direction:column;gap:10px"><div class="s">${esc(x.s)}</div><label class="d">Fecha de recuperación (opcional)<input type="date" class="f" data-pd="${i}:date" value="${x.date||''}" style="padding:0 10px"></label><label class="d">Información adicional (opcional)<input class="f" data-pd="${i}:note" placeholder="Por ejemplo: temas 4 al 7" value="${esc(x.note||'')}"></label></div>`).join('')+(S.pend.length?'':`<div role="alert" class="er">Selecciona al menos una asignatura.</div>`)}return h};

cal(){const b=new Date();b.setDate(1);b.setMonth(b.getMonth()+A.cm);const y=b.getFullYear(),m=b.getMonth(),fi=(b.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),evd=new Set(S.ev.map(e=>e.date)),t=td(),TY={examen:'Examen',entrega:'Entrega',evento:'Evento'};
